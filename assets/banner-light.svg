      <animate attributeName="cy" values="118;108;118" dur="6s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1024" cy="222" r="1.7" fill="#16A34A" opacity="0.35">
      <animate attributeName="opacity" values="0.12;0.5;0.12" dur="4.5s" begin="1.9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="222;212;222" dur="6s" begin="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1092" cy="96" r="2.5" fill="#16A34A" opacity="0.35">
      <animate attributeName="opacity" values="0.12;0.5;0.12" dur="4.5s" begin="3.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="96;86;96" dur="6s" begin="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="96" cy="140" r="1.6" fill="#16A34A" opacity="0.35">
      <animate attributeName="opacity" values="0.12;0.5;0.12" dur="4.5s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="140;130;140" dur="6s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="168" r="1.9" fill="#16A34A" opacity="0.35">
      <animate attributeName="opacity" values="0.12;0.5;0.12" dur="4.5s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="168;158;168" dur="6s" begin="1.1s" repeatCount="indefinite"/>
    </circle>

  <path d="M42 42h36M42 42v36" fill="none" stroke="#16A34A" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <path d="M1158 258h-36M1158 258v-36" fill="none" stroke="#16A34A" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="600" y="88" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="4.5" fill="#16A34A">&gt;_ tahpnart8 --whoami</text>
    <text x="600" y="166" text-anchor="middle" font-size="60" font-weight="700" letter-spacing="6" fill="#0A0A0B">TRAN DUC PHAT</text>
    <text x="600" y="208" text-anchor="middle" font-size="18" letter-spacing="2.5" fill="#52525B">Applied AI &#183; Data Engineering &#183; AIOps</text>

    <g>
      <rect x="450" y="234" width="300" height="34" rx="17" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-opacity="0.32"/>
      <circle cx="477" cy="251" r="4.5" fill="#16A34A">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="493" y="256" font-size="13" font-weight="600" letter-spacing="0.5" fill="#15803D">Open to Applied AI Internship</text>
    </g>
  </g>

  <rect x="-400" y="0" width="400" height="300" fill="url(#scan)" opacity="0.22">
    <animate attributeName="x" values="-400;1200" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="295" width="1200" height="5" fill="url(#accent)"/>
