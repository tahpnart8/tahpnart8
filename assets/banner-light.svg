<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Tran Duc Phat - Applied AI, Data Engineering, AIOps">
  
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="55%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#16A34A" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#16A34A" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16A34A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#16A34A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="300" fill="#FAFAF8"/>
  <rect width="1200" height="300" fill="url(#grid)" mask="url(#gridmask)"/>
  <ellipse cx="600" cy="310" rx="660" ry="210" fill="url(#glow)"/>
  
    <circle cx="150" cy="210" r="2.4" fill="#16A34A" opacity="0.35">
      <animate attributeName="opacity" values="0.12;0.5;0.12" dur="4.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;200;210" dur="6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="268" cy="106" r="1.8" fill="#16A34A" opacity="0.35">
      <animate attributeName="opacity" values="0.12;0.5;0.12" dur="4.5s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="106;96;106" dur="6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="388" cy="246" r="2" fill="#16A34A" opacity="0.35">
