      <stop offset="50%" stop-color="#16A34A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="290" fill="#FAFAF8"/>
  <rect width="1200" height="290" fill="url(#grid)" mask="url(#gridmask)"/>
  <ellipse cx="600" cy="330" rx="660" ry="203" fill="url(#glow)"/>

