<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Journey timeline from starting the BSc in 2024 to graduation in 2028">
  
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="55%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#16A34A" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#16A34A" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1200" height="250" fill="url(#fade)"/></mask>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16A34A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#16A34A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="250" fill="#FAFAF8"/>
  <rect width="1200" height="250" fill="url(#grid)" mask="url(#gridmask)"/>
  <ellipse cx="600" cy="290" rx="660" ry="175" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="90" y="46" font-size="15" font-weight="600" letter-spacing="3.5" fill="#16A34A">&gt;_ git log --graph --since=2024</text>

    <line x1="90" y1="142" x2="1110" y2="142" stroke="#A1A1AA" stroke-opacity="0.28" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="90" y1="142" x2="778.5000000000116" y2="142" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="688.5000000000116" stroke-dashoffset="688.5000000000116">
      <animate attributeName="stroke-dashoffset" from="688.5000000000116" to="0" dur="2.2s" fill="freeze"/>
    </line>
    
    <line x1="90" y1="135" x2="90" y2="149" stroke="#A1A1AA" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="90" y="172" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.5" fill="#A1A1AA">2024</text>
    <line x1="345" y1="135" x2="345" y2="149" stroke="#A1A1AA" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="345" y="172" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.5" fill="#A1A1AA">2025</text>
    <line x1="600" y1="135" x2="600" y2="149" stroke="#A1A1AA" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="600" y="172" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.5" fill="#A1A1AA">2026</text>
    <line x1="855" y1="135" x2="855" y2="149" stroke="#A1A1AA" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="855" y="172" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.5" fill="#A1A1AA">2027</text>
    <line x1="1110" y1="135" x2="1110" y2="149" stroke="#A1A1AA" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="1110" y="172" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.5" fill="#A1A1AA">2028</text>
    
    <g>
      <line x1="281.25" y1="142" x2="281.25" y2="186" stroke="#16A34A" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="281.25" cy="142" r="6" fill="#FAFAF8" stroke="#16A34A" stroke-width="2.5"/>
      <text x="281.25" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#0A0A0B">BSc IT @ UEH</text>
      <text x="281.25" y="219" text-anchor="middle" font-size="11.5" fill="#52525B">enrolled</text>
    </g>
    <g>
      <line x1="447.0000000000232" y1="142" x2="447.0000000000232" y2="108" stroke="#16A34A" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="447.0000000000232" cy="142" r="6" fill="#FAFAF8" stroke="#16A34A" stroke-width="2.5"/>
      <text x="447.0000000000232" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#0A0A0B">First 3-tier apps</text>
      <text x="447.0000000000232" y="111" text-anchor="middle" font-size="11.5" fill="#52525B">C# · WinForms</text>
    </g>
    <g>
      <line x1="587.2500000000116" y1="142" x2="587.2500000000116" y2="186" stroke="#16A34A" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="587.2500000000116" cy="142" r="6" fill="#FAFAF8" stroke="#16A34A" stroke-width="2.5"/>
      <text x="587.2500000000116" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#0A0A0B">Research Award</text>
      <text x="587.2500000000116" y="219" text-anchor="middle" font-size="11.5" fill="#52525B">Prize C · UEH</text>
    </g>
    <g>
      <line x1="651.0000000000116" y1="142" x2="651.0000000000116" y2="108" stroke="#16A34A" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="651.0000000000116" cy="142" r="6" fill="#FAFAF8" stroke="#16A34A" stroke-width="2.5"/>
      <text x="651.0000000000116" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#0A0A0B">DoSCI 2026</text>
      <text x="651.0000000000116" y="111" text-anchor="middle" font-size="11.5" fill="#52525B">Zero Trust</text>
    </g>
    <g>
      <line x1="727.5" y1="142" x2="727.5" y2="186" stroke="#16A34A" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="727.5" cy="142" r="6" fill="#FAFAF8" stroke="#16A34A" stroke-width="2.5"/>
      <text x="727.5" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#0A0A0B">Cloud-native + LLM</text>
      <text x="727.5" y="219" text-anchor="middle" font-size="11.5" fill="#52525B">K8s · Gemini</text>
    </g>
    <g>
      <line x1="1110" y1="142" x2="1110" y2="108" stroke="#16A34A" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="1110" cy="142" r="6" fill="#FAFAF8" stroke="#16A34A" stroke-width="2.5"/>
      <text x="1116" y="94" text-anchor="end" font-size="13" font-weight="700" fill="#0A0A0B">Graduation</text>
      <text x="1116" y="111" text-anchor="end" font-size="11.5" fill="#52525B">target</text>
    </g>

    <g>
      <circle cx="778.5000000000116" cy="142" r="7" fill="#16A34A"/>
      <circle cx="778.5000000000116" cy="142" r="7" fill="none" stroke="#16A34A" stroke-width="2">
        <animate attributeName="r" values="7;18;7" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.75;0;0.75" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="778.5000000000116" y="50" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#16A34A">YOU ARE HERE</text>
      <line x1="778.5000000000116" y1="58" x2="778.5000000000116" y2="80" stroke="#16A34A" stroke-opacity="0.5" stroke-width="1.5"/>
    </g>
  </g>
</svg>
